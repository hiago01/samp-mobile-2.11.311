name: Build SA-MP 2.11.311 Debug

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o projeto
      - name: Checkout
        uses: actions/checkout@v5

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # 4. Instalar SDK / NDK / CMake
      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      # 5. Configurar NDK
      - name: Configure Android environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.2.11394342" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.2.11394342" >> $GITHUB_ENV

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/26.2.11394342" >> local.properties

      # 6. Verificar ambiente
      - name: Verify environment
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          chmod +x gradlew
          ./gradlew --version

          echo "===== ANDROID SDK ====="
          echo "$ANDROID_SDK_ROOT"

          echo "===== NDK ====="
          ls -la "$ANDROID_SDK_ROOT/ndk/26.2.11394342"

          echo "===== CMAKE ====="
          "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake" --version

      # 7. Mostrar estrutura Gradle
      - name: Inspect project
        run: |
          echo "===== PROJECTS ====="
          ./gradlew projects

          echo "===== app/build.gradle ====="
          sed -n '1,260p' app/build.gradle

          echo "===== CMakeLists.txt ====="
          sed -n '1,260p' app/src/main/cpp/CMakeLists.txt

      # 8. Limpar
      - name: Clean
        run: |
          ./gradlew :app:clean

      # 9. Compilar Debug
      - name: Assemble Debug
        run: |
          ./gradlew :app:assembleDebug \
            --stacktrace \
            --info \
            --warning-mode all

      # 10. Procurar APK
      - name: Find APK
        if: success()
        run: |
          echo "===== APK FOUND ====="
          find app/build/outputs -type f -name "*.apk" -print

      # 11. Enviar APK como artefato
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: samp-mobile-2.11.311-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
